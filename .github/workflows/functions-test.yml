name: Cloud Functions Tests

on:
  push:
    branches: [ main, claude/** ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ '20.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run unit tests
        run: |
          cd functions
          npm test

      - name: Check for npm vulnerabilities
        run: |
          cd functions
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: functions/test/
