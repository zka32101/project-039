name: Cloud Functions Tests

# chikaba_kore（近場まっぷ）への統合が完了したため、自動実行を停止し手動実行のみ許可する。
# 詳細は README.md の「近場まっぷへの統合について」を参照。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ '20.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run unit tests
        run: |
          cd functions
          npm test

      - name: Check for npm vulnerabilities
        run: |
          cd functions
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: functions/test/
