name: Prototype Route Search Verification

# chikaba_kore（近場まっぷ）への統合が完了したため、自動実行を停止し手動実行のみ許可する。
# 詳細は README.md の「近場まっぷへの統合について」を参照。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ '20.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd prototype
          npm install

      - name: Run prototype unit tests
        run: |
          cd prototype
          npm test

      - name: Run benchmark (performance measurement)
        run: |
          cd prototype
          npm run benchmark
        continue-on-error: true

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-verification-results
          path: prototype/RESULTS*.md
