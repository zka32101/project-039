name: Prototype Route Search Verification

on:
  push:
    branches: [ main, claude/** ]
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-verification.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-verification.yml'

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ '20.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd prototype
          npm install

      - name: Run prototype unit tests
        run: |
          cd prototype
          npm test

      - name: Run benchmark (performance measurement)
        run: |
          cd prototype
          npm run benchmark
        continue-on-error: true

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-verification-results
          path: prototype/RESULTS*.md
