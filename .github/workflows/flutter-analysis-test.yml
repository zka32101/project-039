name: Flutter Analysis & Test

# chikaba_kore（近場まっぷ）への統合が完了したため、自動実行を停止し手動実行のみ許可する。
# 詳細は README.md の「近場まっぷへの統合について」を参照。
on:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Run Flutter Analyzer
        run: |
          cd app
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd app
          flutter test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: app/test/
