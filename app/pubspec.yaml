name: anshinmichi
description: "あんしんみち — 影・雨よけ・夜の明るさをみんなで塗って共有する、安心して歩ける道の地図アプリ"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  geolocator: ^12.0.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  firebase_remote_config: ^5.1.3
  purchases_flutter: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_road_network.json
